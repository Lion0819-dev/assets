<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リアルタイム資産管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#1e293b">
  <!-- 外部ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="container">
    <!-- 総資産カード -->
    <section class="total-card">
      <div class="total-label">総資産額</div>
      <div class="total-amount" id="totalAsset">¥--,---,---</div>
      <div class="last-update">
        <span id="updateTime">同期中...</span>
        <span>リアルタイム連携済</span>
      </div>
    </section>

    <!-- 入力フォーム -->
    <section class="card">
      <div class="tab-group" id="tabGroup">
        <button class="tab-btn active" data-type="expense">支出</button>
        <button class="tab-btn" data-type="income">収入</button>
        <button class="tab-btn" data-type="transfer">振替</button>
      </div>

      <form id="txForm">
        <input type="hidden" id="txType" value="expense">

        <div class="form-group">
          <label class="form-label" for="txDate">日付</label>
          <input type="date" id="txDate" class="form-control" required>
        </div>

        <div id="singleAccountGroup" class="form-group">
          <label class="form-label" id="accountLabel" for="txAccount">利用口座</label>
          <select id="txAccount" class="form-control" required></select>
        </div>

        <div id="transferAccountGroup" class="form-row hidden">
          <div class="form-group">
            <label class="form-label" for="txFromAccount">出金元</label>
            <select id="txFromAccount" class="form-control"></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="txToAccount">入金先</label>
            <select id="txToAccount" class="form-control"></select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="txAmount">金額 (円)</label>
            <input type="number" id="txAmount" class="form-control" placeholder="0" min="1" inputmode="numeric" required>
          </div>
          <div class="form-group" id="categoryGroup">
            <label class="form-label" for="txCategory">カテゴリ</label>
            <select id="txCategory" class="form-control"></select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="txMemo">メモ (任意)</label>
          <input type="text" id="txMemo" class="form-control" placeholder="例: ランチ、カフェ代">
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">支出を記録</button>
      </form>
    </section>

     <!-- 口座別残高 -->
    <section class="card">
      <div class="section-header">
        <div class="section-title">口座別残高</div>
        <div>
          <button id="addAccountBtn" class="add-btn">+ 追加</button>
          <button id="refreshBtn" class="refresh-btn">↻</button>
        </div>
      </div>
      <div class="account-list" id="accountList"></div>
    </section>

    <!-- 口座追加モーダル(ダイアログ) -->
     <div id="accountModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">口座の追加</div>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <form id="addAccountForm">
          <div class="form-group">
            <label class="form-label" for="newAccountName">口座名</label>
            <input type="text" id="newAccountName" class="form-control" placeholder="例：楽天銀行、現金" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="newAccountType">種別</label>
            <select id="newAccountType" class="form-control" required>
              <option value="銀行口座">銀行口座</option>
              <option value="現金">現金</option>
              <option value="クレジットカード">クレジットカード</option>
              <option value="電子マネー">電子マネー</option>
              <option value="証券・投資">証券・投資</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="initialBalance">初期残高（円）</label>
            <input type="number" id="initialBalance" class="form-control" placeholder="0" value="0" required>
          </div>
          <button type="submit" id="saveAccountBtn" class="submit-btn" style="background: #3b82f6;">追加する</button>
        </form>
      </div>
     </div>

    <!-- 資産ポートフォリオ -->
    <section class="card">
      <div class="section-title">資産ポートフォリオ</div>
      <div class="chart-container">
        <canvas id="assetChart"></canvas>
      </div>
    </section>

    <!-- 支出カテゴリ内訳 -->
    <section class="card">
      <div class="section-title">今月の支出カテゴリ</div>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
    </section>
   
  </div>

  <div id="toast" class="toast">記録しました！</div>

  <!-- 分割したJSファイルの読み込み -->
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
