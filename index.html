<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム資産管理</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <style>
    body { font-family: -apple-system, sans-serif; background: #f8fafc; margin: 0; padding: 20px; text-align: center; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-top: 20px; }
    .label { color: #64748b; font-size: 14px; font-weight: bold; }
    .amount { font-size: 32px; font-weight: bold; color: #0f172a; margin: 12px 0; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="card">
    <div class="label">現在の総資産</div>
    <div class="amount" id="totalAsset">読み込み中...</div>
    <button onclick="fetchAsset()">最新に更新</button>
  </div>

  <script>
    // GASで発行されたWebアプリURLをここに貼る
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxmwsZ1-7u3Z8vDknC3i0arVjyBNw50JoGTBjQ7SzActHDaXciDHnuPOGwYezSYqWgXug/exec';

    async function fetchAsset() {
      const amountEl = document.getElementById('totalAsset');
      amountEl.innerText = '更新中...';
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        // 数字を「1,500,000円」形式に整形
        amountEl.innerText = '¥' + Number(data.totalAsset).toLocaleString();
      } catch (err) {
        amountEl.innerText = '取得失敗';
        console.error(err);
      }
    }

    // 画面が開いたときに自動取得
    fetchAsset();

    // PWA用のService Worker登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
